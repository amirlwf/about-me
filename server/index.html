<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VLESS - پیکربندی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Prevent FOUC - set theme before paint
    (function() {
      var theme = localStorage.getItem('vless-theme');
      if (theme) document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <!-- ============ SPLASH SCREEN ============ -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-grid"></div>
    <div class="splash-noise"></div>
    <div class="splash-corner splash-corner--tl"></div>
    <div class="splash-corner splash-corner--tr"></div>
    <div class="splash-corner splash-corner--bl"></div>
    <div class="splash-corner splash-corner--br"></div>

    <div class="splash-content">
      <div class="splash-logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
      </div>
      <div class="splash-title">VLESS</div>
      <div class="splash-subtitle">توزیع امن کانفیگ</div>
      <div class="splash-line"></div>
      <div class="splash-enter">
        <button class="splash-enter-btn" onclick="enterSite()">
          ورود
        </button>
      </div>
    </div>
  </div>

  <!-- ============ MAIN CONTENT ============ -->
  <div class="main-content" id="mainContent">
    <div class="page-wrapper">
      <div class="container">
        <!-- Header -->
        <div class="header">
          <div class="logo">
            <div class="logo-icon">⚡</div>
            <span class="logo-text">VLESS</span>
          </div>
          <p class="header-subtitle">سیستم توزیع کانفیگ امن و سریع</p>
        </div>

        <!-- Login Card -->
        <div class="card" id="loginCard">
          <div class="card-title">
            <span class="icon">→</span>
            <span>ورود به حساب</span>
          </div>

          <!-- Tabs -->
          <div class="tabs">
            <button class="tab-btn active" data-tab="login" onclick="switchTab('login')">
              ورود
            </button>
            <button class="tab-btn" data-tab="register" onclick="switchTab('register')">
              ثبت‌نام جدید
            </button>
          </div>

          <!-- Alert Container -->
          <div id="alertContainer"></div>

          <!-- Login Form -->
          <div class="tab-content active" id="tab-login">
            <form id="loginForm" onsubmit="handleLogin(event)">
              <div class="form-group">
                <label class="form-label">ایمیل</label>
                <input type="email" class="form-input" id="loginEmail" placeholder="example@email.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">رمز عبور</label>
                <input type="password" class="form-input" id="loginPassword" placeholder="••••••••" required>
              </div>
              <button type="submit" class="btn btn-primary btn-block" id="loginBtn">
                ورود
              </button>
            </form>
            <div class="divider"></div>
            <p style="text-align:center; color:var(--gray-600); font-size:0.82rem;">
              اولین ورود؟ از تب «ثبت‌نام جدید» استفاده کنید
            </p>
          </div>

          <!-- Register Form -->
          <div class="tab-content" id="tab-register">
            <form id="registerForm" onsubmit="handleRegister(event)">
              <div class="form-group">
                <label class="form-label">نام نمایشی</label>
                <input type="text" class="form-input" id="regName" placeholder="نام شما" required>
              </div>
              <div class="form-group">
                <label class="form-label">ایمیل</label>
                <input type="email" class="form-input" id="regEmail" placeholder="example@email.com" required>
              </div>
              <div class="form-group">
                <label class="form-label">رمز عبور</label>
                <input type="password" class="form-input" id="regPassword" placeholder="حداقل ۶ کاراکتر" required minlength="6">
              </div>
              <div class="form-group">
                <label class="form-label">کد ورود یکبار مصرف</label>
                <input type="text" class="form-input" id="regCode" placeholder="کد ۶ رقمی" required maxlength="6" pattern="[0-9]{3,6}" style="text-align:center; letter-spacing:4px; font-size:1.2rem;">
                <p class="form-hint">کد را از مدیر سیستم دریافت کنید (معتبر به مدت ۵ دقیقه)</p>
              </div>
              <button type="submit" class="btn btn-accent btn-block" id="registerBtn">
                ثبت‌نام و ورود
              </button>
            </form>
          </div>
        </div>

        <!-- Footer -->
        <div class="footer">
          <p>ساخته شده توسط <a href="https://amirlwf.ir" target="_blank">amirlwf.ir</a></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Noise Overlay -->
  <div class="noise-overlay"></div>

  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="تغییر حالت نمایش">
    <span class="icon-moon">🌙</span>
    <span class="icon-sun">☀️</span>
  </button>

  <!-- Supabase JS CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script type="module">
    import { getSupabase, apiCall, showError, showSuccess, hideAlert, showLoading, hideLoading, toggleTheme } from "./js/utils.js";

    // Expose toggleTheme to window for onclick handler
    window.toggleTheme = toggleTheme;

    // ============================================================
    // Splash Screen
    // ============================================================
    window.enterSite = function() {
      const splash = document.getElementById('splashScreen');
      const main = document.getElementById('mainContent');

      splash.classList.add('fade-out');

      setTimeout(() => {
        splash.style.display = 'none';
        main.classList.add('visible');
      }, 800);
    };

    // Auto-enter after 4 seconds if user doesn't click
    setTimeout(() => {
      const splash = document.getElementById('splashScreen');
      if (splash && splash.style.display !== 'none') {
        window.enterSite();
      }
    }, 4000);

    // ============================================================
    // Auth Check
    // ============================================================
    const supabase = getSupabase();
    (async function checkExistingSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (session) {
        window.location.href = "dashboard.html";
      }
    })();

    // ============================================================
    // Tab switching
    // ============================================================
    window.switchTab = function(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.toggle('active', content.id === `tab-${tab}`);
      });
      hideAlert(document.getElementById('alertContainer'));
    };

    // ============================================================
    // Login handler
    // ============================================================
    window.handleLogin = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const alertContainer = document.getElementById('alertContainer');

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) {
        showError("لطفاً تمام فیلدها را پر کنید", alertContainer);
        return;
      }

      showLoading(btn);
      hideAlert(alertContainer);

      try {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          if (error.message.includes("Invalid login")) {
            showError("ایمیل یا رمز عبور اشتباه است", alertContainer);
          } else {
            showError(error.message || "خطا در ورود", alertContainer);
          }
          return;
        }

        showSuccess("ورود با موفقیت انجام شد...", alertContainer);
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 800);
      } catch (err) {
        showError("خطای غیرمنتظره: " + err.message, alertContainer);
      } finally {
        hideLoading(btn);
      }
    };

    // ============================================================
    // Register handler
    // ============================================================
    window.handleRegister = async function(e) {
      e.preventDefault();
      const btn = document.getElementById('registerBtn');
      const alertContainer = document.getElementById('alertContainer');

      const name = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const code = document.getElementById('regCode').value.trim();

      if (!name || !email || !password || !code) {
        showError("لطفاً تمام فیلدها را پر کنید", alertContainer);
        return;
      }

      if (password.length < 6) {
        showError("رمز عبور باید حداقل ۶ کاراکتر باشد", alertContainer);
        return;
      }

      if (!/^\d{3,6}$/.test(code)) {
        showError("کد ورود باید بین ۳ تا ۶ رقم باشد", alertContainer);
        return;
      }

      showLoading(btn);
      hideAlert(alertContainer);

      try {
        const { FUNCTION_URLS } = await import("./js/config.js");

        const data = await apiCall(FUNCTION_URLS.verifyEntryCode, {
          method: "POST",
          body: JSON.stringify({
            email,
            password,
            entry_code: code,
            display_name: name,
          }),
        });

        if (data.session) {
          await supabase.auth.setSession(data.session);
          showSuccess("ثبت‌نام با موفقیت انجام شد!", alertContainer);
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } else {
          showSuccess("حساب ساخته شد. لطفاً وارد شوید", alertContainer);
          setTimeout(() => {
            window.switchTab('login');
            document.getElementById('loginEmail').value = email;
          }, 1500);
        }
      } catch (err) {
        showError(err.message || "خطا در ثبت‌نام", alertContainer);
      } finally {
        hideLoading(btn);
      }
    };
  </script>
</body>
</html>
